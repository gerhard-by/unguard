spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
spring.jpa.generate-ddl=true


# Tomcat access log -> container stdout (combined pattern includes the
# authenticated remote user %u, so successful /admin/* calls record who
# authenticated). Standard for a production web app; here it is also the
# log-based signal for CVE-2026-43512 (an admin 200 whose %u is not a real
# account). directory=/dev + prefix=stdout + empty suffix writes to /dev/stdout.
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=combined
server.tomcat.accesslog.directory=/dev
server.tomcat.accesslog.prefix=stdout
server.tomcat.accesslog.suffix=
server.tomcat.accesslog.buffered=false
# Without these, Tomcat appends a date and writes to a rotated file
# (/dev/stdout.YYYY-MM-DD) instead of the /dev/stdout symlink, so OneAgent would
# never see the lines. Disable rotation and the date suffix to target /dev/stdout.
server.tomcat.accesslog.rotate=false
server.tomcat.accesslog.file-date-format=
