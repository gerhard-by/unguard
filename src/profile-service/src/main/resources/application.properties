spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
spring.jpa.generate-ddl=true


# Resolve the real client IP from X-Forwarded-For. Tomcat's RemoteIpValve resolves
# the forwarded client IP when the immediate peer is a trusted proxy (the default
# trusted set covers 127.0.0.0/8, 10/8, 172.16/12 and 192.168/16 -- i.e. the
# frontend pod and local port-forwards), and falls back to the real peer address
# when no X-Forwarded-For is present. It exposes the result via the standard
# AccessLog request attributes.
server.tomcat.remoteip.remote-ip-header=x-forwarded-for

# Tomcat access log -> container stdout, standard "combined" format. Two fields make
# it the log-based signal for CVE-2026-43512: the authenticated remote user %u (a
# successful /admin/* call records who authenticated -- an admin 200 whose %u is not
# a real account is the bypass) and %h, the resolved client IP, which ties the
# bypass to the same attacker's injection attempts that backend OneAgents record
# under the same forwarded IP. request-attributes-enabled makes %h read the client
# IP that RemoteIpValve resolved (otherwise %h would log the immediate peer).
# directory=/dev + prefix=stdout + empty suffix writes to /dev/stdout.
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.pattern=combined
server.tomcat.accesslog.request-attributes-enabled=true
server.tomcat.accesslog.directory=/dev
server.tomcat.accesslog.prefix=stdout
server.tomcat.accesslog.suffix=
server.tomcat.accesslog.buffered=false
# Without these, Tomcat appends a date and writes to a rotated file
# (/dev/stdout.YYYY-MM-DD) instead of the /dev/stdout symlink, so OneAgent would
# never see the lines. Disable rotation and the date suffix to target /dev/stdout.
server.tomcat.accesslog.rotate=false
server.tomcat.accesslog.file-date-format=
