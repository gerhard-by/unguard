{{- if and (.Values.ragService.enabled) (.Values.ollama.enabled) }}
apiVersion: v1
kind: Service
metadata:
  name: unguard-ollama
{{- with .Values.labels.common }}
  labels:
{{ include "renderLabels" . | indent 4 }}
{{- end }}
spec:
  type: ClusterIP
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unguard-ollama
{{- with .Values.labels.common }}
  labels:
{{ include "renderLabels" . | indent 4 }}
{{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
{{- with .Values.labels.common }}
{{ include "renderLabels" . | indent 8 }}
{{- end }}
    spec:
      containers:
        - name: ollama
          image: {{ .Values.ollama.image.repository }}:{{ .Values.ollama.image.tag }}
          imagePullPolicy: {{ .Values.ollama.image.pullPolicy }}
          ports:
            - containerPort: 11434
          command: ["ollama"]
          args: ["serve"]
{{- end }}
